[project]
name = "system_monitoring_flow"
version = "0.1.0"
description = "system_monitoring_flow using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.13"
dependencies = [
    "crewai[bedrock,tools]==1.14.7",
    "langchain==1.2.15",
]

[project.scripts]
kickoff = "system_monitoring_flow.main:kickoff"
run_crew = "system_monitoring_flow.main:kickoff"
plot = "system_monitoring_flow.main:plot"
run_with_trigger = "system_monitoring_flow.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
